# Fly.io-configuratie voor Mailvio.
# Pas 'app' hieronder aan als deze naam al bezet is (fly launch stelt dat dan zelf voor).
app = "mailvio-app"
primary_region = "ams"  # Amsterdam — dichtstbij voor een Belgische gebruiker

[build]

[env]
  PORT = "8080"
  # Houdt Node binnen de perken: ruimt geheugen eerder op in plaats van te
  # blijven groeien tot de machine hem afschiet.
  NODE_OPTIONS = "--max-old-space-size=320"

# Persistente schijf voor data/settings.json (IMAP/SMTP/AI-instellingen).
# Dit lost het probleem van Render's gratis plan op: instellingen overleven
# hier wél een herdeploy.
[[mounts]]
  source = "mailvio_data"
  destination = "/app/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  # 256mb bleek te krap: de machine werd telkens door geheugengebrek gedood
  # (OOM) tijdens het inlezen van mails. 512mb geeft Node genoeg lucht.
  memory = "512mb"
